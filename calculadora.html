<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de costos · Treek</title>
<meta name="theme-color" content="#8b35f5">
<script>try{var t=localStorage.getItem('t3d-th');document.documentElement.dataset.t=(t?t==='d':matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}catch(e){}</script>
<!-- Tipografía Inter (SIL Open Font License 1.1). Si la alojas tú, incluye su archivo de licencia. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500&display=swap">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page"><h1>Calculadora de costos FDM</h1><span class="mu">Precios en bolivianos (Bs). Ajusta los datos y obtén el costo al instante.</span>
<div class="calc">
<form class="card pan fg" id="cf" onsubmit="return false">
<label>Material<select id="mat" aria-label="Material"></select></label>
<label>Precio filamento (<span class="cu">Bs</span>/kg)<input id="pk" type="number" min="0" max="2000" step="any" inputmode="decimal"></label>
<label>Peso de la pieza (g)<input id="g" type="number" min="0" max="20000" step="any" inputmode="decimal" value="50"></label>
<label>Tiempo de impresión (h)<input id="h" type="number" min="0" max="500" step="any" inputmode="decimal" value="3"></label>
<label>Consumo impresora (W)<input id="w" type="number" min="0" max="1500" step="any" inputmode="decimal" value="150"></label>
<label>Costo energía (<span class="cu">Bs</span>/kWh)<input id="kw" type="number" min="0" max="20" step="any" inputmode="decimal" value="1"></label>
<label><span class="lt">Desgaste máquina (<span class="cu">Bs</span>/h) <sakuga-tooltip text="Costo de usar la impresora cada hora: repuestos, mantenimiento y desgaste." label="Ayuda: desgaste"></sakuga-tooltip></span><input id="mh" type="number" min="0" max="100" step="any" inputmode="decimal" value="3"></label>
<label><span class="lt">Mano de obra (<span class="cu">Bs</span>/pieza) <sakuga-tooltip text="Tu tiempo para preparar, retirar y dar acabado a cada pieza." label="Ayuda: mano de obra"></sakuga-tooltip></span><input id="lb" type="number" min="0" max="5000" step="any" inputmode="decimal" value="15"></label>
<div class="fld"><span>Fallos (%) <sakuga-tooltip text="Costo extra por piezas que salen mal y hay que repetir." label="Ayuda: fallos"></sakuga-tooltip></span><sakuga-slider id="fl" label="Fallos" value="5" min="0" max="30" step="1"></sakuga-slider></div>
<div class="fld"><span>Margen (%) <sakuga-tooltip text="Tu ganancia sobre el costo total de la pieza." label="Ayuda: margen"></sakuga-tooltip></span><sakuga-slider id="mg" label="Margen" value="40" min="0" max="150" step="1"></sakuga-slider></div>
<label class="full">Cantidad<input id="q" type="number" min="1" max="10000" step="1" inputmode="numeric" value="1"></label>
</form>
<div class="card pan res" aria-live="polite">
<div id="rsk" aria-hidden="true"><div class="sk" style="height:18px;width:40%;margin-bottom:12px"></div><div class="sk" style="height:48px;width:70%;margin-bottom:16px"></div><div class="sk" style="height:90px"></div></div>
<div id="rv" hidden><span class="mu">Precio total</span><div class="tot" id="tt"></div><span class="mu" id="tu"></span>
<ul class="bk" id="bk"></ul>
<p class="mu" id="hint" hidden>Ingresa el peso y el tiempo de la pieza para ver el precio.</p>
<sakuga-button class="w" id="cq">Cotizar por WhatsApp</sakuga-button></div>
</div></div>
</main>
<script src="assets/sakuga/button.js"></script>
<script src="assets/sakuga/slider.js"></script>
<script src="assets/sakuga/tooltip.js"></script>
<script src="app.js"></script>
<script>
shell('calc');
const MAT={PLA:160,PETG:180,ABS:200}; // Bs/kg de referencia (tiendas bolivianas, nov. 2026); editables en pantalla
const LIM={g:20000,pk:2000,w:1500,h:500,kw:20,mh:100,lb:5000,q:10000};
/* calculadora */
const F=id=>Math.min(LIM[id]||1e9,Math.max(0,parseFloat($('#'+id).value)||0));
$('#mat').innerHTML=Object.keys(MAT).map(k=>`<option>${k}</option>`).join('');$('#pk').value=MAT.PLA;
$('#mat').onchange=()=>{$('#pk').value=MAT[$('#mat').value];calc()};
let R={};
function calc(){
const g=F('g'),h=F('h'),mat=g/1000*F('pk'),en=F('w')/1000*h*F('kw'),mq=h*F('mh'),lb=F('lb'),sub=mat+en+mq,fl=sub*F('fl')/100,base=sub+fl+lb,mg=base*F('mg')/100;
const u=Math.round((base+mg)*100+1e-7)/100,q=Math.max(1,Math.round(F('q'))||1),ok=g>0&&h>0;
R={u,t:Math.round(u*q*100+1e-7)/100,q,mat,en,mq,lb,fl,mg,ok};
$('#tt').textContent=ok?fm(R.t):'—';$('#tu').textContent=!ok?'Falta el peso o el tiempo':q>1?fm(u)+' por unidad × '+q:'1 unidad';
$('#cq').toggleAttribute('disabled',!ok);$('#hint').hidden=ok;
$('#bk').innerHTML=ok?[['Filamento',R.mat],['Energía',R.en],['Desgaste máquina',R.mq],['Mano de obra',R.lb],['Recargo por fallos',R.fl],['Ganancia',R.mg]].map(a=>`<li><span>${a[0]}</span><b>${fm(a[1])}</b></li>`).join(''):''}
$('#cf').addEventListener('input',calc);
$('#cq').onclick=()=>{if(R.ok&&wa(`Hola Treek, quiero cotizar una pieza.\nMaterial: ${$('#mat').value}\nPeso: ${F('g')} g · Tiempo: ${F('h')} h\nCantidad: ${R.q}\nEstimado de la calculadora: ${fm(R.t)}${R.q>1?' ('+fm(R.u)+' c/u)':''}`))$('#cq').done()};
['fl','mg'].forEach(i=>$('#'+i).addEventListener('input',calc));


calc();DATA.then(()=>{document.querySelectorAll('.cu').forEach(e=>e.textContent=cur());calc();$('#rsk').remove();$('#rv').hidden=false});
</script>
</body>
</html>
